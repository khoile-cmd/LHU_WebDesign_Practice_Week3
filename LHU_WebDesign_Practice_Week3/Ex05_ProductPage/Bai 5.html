<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Product Page Layout</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .product-page {
            display: grid;
            grid-template-columns: 60% 40%;
            max-width: 1000px;
            width: 95%;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .product-image {
            background-color: #eaeaea;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .product-info {
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-title {
            font-size: 26px;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .product-price {
            font-size: 22px;
            color: #e74c3c;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .product-desc {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .section-label {
            font-weight: bold;
            font-size: 14px;
            color: #333;
            margin-bottom: 8px;
        }

        .options-group {
            margin-bottom: 20px;
        }

        .size-options {
            display: flex;
            gap: 10px;
        }

        .size-btn {
            width: 40px;
            height: 40px;
            border: 1px solid #ccc;
            background-color: #fff;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .size-btn:hover, .size-btn.active {
            border-color: #3498db;
            color: #3498db;
            background-color: #f0f8ff;
        }

        .color-options {
            display: flex;
            gap: 12px;
        }

        .color-circle {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.2s;
        }

        .color-circle:hover {
            transform: scale(1.1);
        }

        .color-1 { background-color: #2c3e50; }
        .color-2 { background-color: #e74c3c; }
        .color-3 { background-color: #3498db; }

        .quantity-wrapper {
            display: flex;
            align-items: center;
            border: 1px solid #ccc;
            border-radius: 6px;
            width: max-content;
            overflow: hidden;
            margin-bottom: 25px;
        }

        .qty-btn {
            background-color: #f1f1f1;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        .qty-btn:hover {
            background-color: #e1e1e1;
        }

        .qty-input {
            width: 50px;
            text-align: center;
            border: none;
            font-size: 16px;
            outline: none;
        }

        .btn-add-cart {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }

        .btn-add-cart:hover {
            background-color: #219653;
        }
    </style>
</head>
